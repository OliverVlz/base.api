services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: pos_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Aplicación NestJS para desarrollo
  app:
    build:
      context: .
      target: development
    container_name: pos_app_dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Para hot reload en desarrollo
      - .:/app
      - /app/node_modules

volumes:
  mysql_dev_data: 